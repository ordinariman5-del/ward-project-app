<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->

                <div class="bg-sky-600 p-2.5 rounded-lg text-white text-xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide">১১ আসনের উন্নয়ন ও প্রকল্প তথ্যভান্ডার</h1>
                    <p class="text-xs sm:text-sm text-slate-300">ওয়ার্ড ও প্রকল্প ভিত্তিক পিডিএফ ফলাফল ব্যবস্থাপনা</p>
                </div>
            </div>
            <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-lg font-medium transition shadow flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> সাহায্য বা প্রকল্পের আবেদন করুন
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <option value="সব">সকল ওয়ার্ড (২৭-৪১)</option>
                        <option value="২৭ নং দক্ষিণ আগ্রাবাদ">২৭ নং দক্ষিণ আগ্রাবাদ</option>
                        <option value="২৮ নং দক্ষিণ পাঠানটুলী">২৮ নং দক্ষিণ পাঠানটুলী</option>
                        <option value="২৯ নং পশ্চিম মাদারবাড়ী">২৯ নং পশ্চিম মাদারবাড়ী</option>
                        <option value="৩০ নং পূর্ব মাদারবাড়ী">৩০ নং পূর্ব মাদারবাড়ী</option>
                        <option value="৩৬ নং গোসাইলডাঙ্গা">৩৬ নং গোসাইলডাঙ্গা</option>

                        <option value="৩৮ নং দক্ষিণ মধ্য হালিশহর">৩৮ নং দক্ষিণ মধ্য হালিশহর</option>
                        <option value="৩৯ নং দক্ষিণ হালিশহর">৩৯ নং দক্ষিণ হালিশহর</option>
                        <option value="৪০ নং উত্তর পতেঙ্গা">৪০ নং উত্তর পতেঙ্গা</option>
                        <option value="৪১ নং দক্ষিণ পতেঙ্গা">৪১ নং দক্ষিণ পতেঙ্গা</option>
                    </select>
                </div>

                <!-- প্রকল্প ফিল্টার -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">প্রকল্প বা অনুদান নির্বাচন করুন:</label>
                    <select id="filterProjectSelect" onchange="applyFilters()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600 font-medium">
                        <option value="সব">সকল প্রকল্প ও অনুদান</option>
                        <option value="১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)">১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)</option>
                        <option value="২। টি.আর কর্মসূচি (৩০ লক্ষ)">২। টি.আর কর্মসূচি (৩০ লক্ষ)</option>
                        <option value="৩। টি.আর কর্মসূচি (৯০ লক্ষ)">৩। টি.আর কর্মসূচি (৯০ লক্ষ)</option>
                        <option value="৪। টি.আর কর্মসূচি (৪০ লক্ষ)">৪। টি.আর কর্মসূচি (৪০ লক্ষ)</option>
                        <option value="৫। জেলা পরিষদের প্রকল্প (৫০ লক্ষ)">৫। জেলা পরিষদের প্রকল্প (৫০ লক্ষ)</option>
                        <option value="৬। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)">৬। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)</option>
                        <option value="৭। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)">৭। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)</option>
                        <option value="৮। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)">৮। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)</option>
                        <option value="৯। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)">৯। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)</option>
                        <option value="১০। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ">১০। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ</option>
                        <option value="১১। ঈদুল আযহা-২০২৬ মাংস বিতরণ">১১। ঈদুল আযহা-২০২৬ মাংস বিতরণ</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-between items-center text-sm text-slate-700 font-medium pt-2 border-t border-slate-100">
                <span>ফলাফল পাওয়া গেছে:</span>
                <span id="totalCount" class="font-bold text-sky-600">0</span> টি প্রজেক্ট
            </div>
        </div>

        <!-- Table Structure -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs sm:text-sm border-b border-slate-200">
                            <th class="p-3 font-semibold">ওয়ার্ড</th>
                            <th class="p-3 font-semibold">প্রকল্পের নাম ও পাস হওয়া বিবরণ</th>
                            <th class="p-3 font-semibold">বরাদ্দ / পরিমাণ</th>
                            <th class="p-3 font-semibold">অফিসিয়াল পিডিএফ ফলাফল</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody" class="divide-y divide-slate-200 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="projectModal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-file-pdf text-sky-600"></i> সাহায্য বা প্রকল্পের আবেদন ফরম</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="submissionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ওয়ার্ড নির্বাচন করুন *</label>
                        <select id="wardNo" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none">
                            <option value="">-- ওয়ার্ড সিলেক্ট করুন --</option>
                            <option value="২৭ নং দক্ষিণ আগ্রাবাদ">২৭ নং দক্ষিণ আগ্রাবাদ</option>
                            <option value="২৮ নং দক্ষিণ পাঠানটুলী">২৮ নং দক্ষিণ পাঠানটুলী</option>
                            <option value="২৯ নং পশ্চিম মাদারবাড়ী">২৯ নং পশ্চিম মাদারবাড়ী</option>
                            <option value="৩০ নং পূর্ব মাদারবাড়ী">৩০ নং পূর্ব মাদারবাড়ী</option>
                            <option value="৩৬ নং গোসাইলডাঙ্গা">৩৬ নং গোসাইলডাঙ্গা</option>
                            <option value="৩৭ নং মুনির নগর">৩৭ নং মুনির নগর</option>
                            <option value="৩৮ নং দক্ষিণ মধ্য হালিশহর">৩৮ নং দক্ষিণ মধ্য হালিশহর</option>
                            <option value="৩৯ নং দক্ষিণ হালিশহর">৩৯ নং দক্ষিণ হালিশহর</option>
                            <option value="৪০ নং উত্তর পতেঙ্গা">৪০ নং উত্তর পতেঙ্গা</option>
                            <option value="৪১ নং দক্ষিণ পতেঙ্গা">৪১ নং দক্ষিণ পতেঙ্গা</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">প্রকল্পের খাত নির্বাচন করুন *</label>
                        <select id="projectCategory" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none">
                            <option value="">-- প্রকল্প সিলেক্ট করুন --</option>
                            <option value="১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)">১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)</option>
                            <option value="২। টি.আর কর্মসূচি (৩০ লক্ষ)">২। টি.আর কর্মসূচি (৩০ লক্ষ)</option>
                            <option value="৩। টি.আর কর্মসূচি (৯০ লক্ষ)">৩। টি.আর কর্মসূচি (৯০ লক্ষ)</option>
                            <option value="৪। টি.আর কর্মসূচি (৪০ লক্ষ)">৪। টি.আর কর্মসূচি (৪০ লক্ষ)</option>
                            <option value="৫। জেলা পরিষদের প্রকল্প (৫০ লক্ষ)">৫। জেলা পরিষদের প্রকল্প (৫০ লক্ষ)</option>
                            <option value="৬। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)">৬। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)</option>
                            <option value="৭। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)">৭। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)</option>
                            <option value="৮। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)">৮। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)</option>
                            <option value="৯। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)">৯। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)</option>
                            <option value="১০। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ">১০। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ</option>
                            <option value="১১। ঈদুল আযহা-২০২৬ মাংস বিতরণ">১১। ঈদুল আযহা-২০২৬ মাংস বিতরণ</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">আবেদনকারীর নাম *</label>
                        <input type="text" id="applicantName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="পূর্ণ নাম লিখুন">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">মোবাইল নম্বর *</label>
                        <input type="tel" id="applicantPhone" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="০১৭xxxxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">জাতীয় পরিচয়পত্র (NID) নম্বর *</label>
                        <input type="text" id="applicantNID" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="NID নম্বর লিখুন">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">বরাদ্দ / প্রয়োজনীয় পরিমাণ</label>
                        <input type="text" id="projectAmount" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="যেমন: ৫০,০০০ টাকা">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">পূর্ণাঙ্গ ঠিকানা *</label>
                    <textarea id="applicantAddress" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="গ্রাম/মহল্লা, রোড নং, এলাকা"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">বিস্তারিত বিবরণ ও ফাইলের লিংক *</label>
                    <textarea id="projectDesc" rows="3" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="বিস্তারিত বিবরণ ও পিডিএফ ড্রাইভ লিংক এখানে দিন..."></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300 transition">বাতিল</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 text-white rounded-lg text-sm font-medium hover:bg-sky-700 transition">আবেদন সাবমিট করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Data Logic -->
    <script>
        const defaultProjects = [
            {
                ward: "২৭ নং দক্ষিণ আগ্রাবাদ",
                category: "২। টি.আর কর্মসূচি (৩০ লক্ষ)",

            {

        function openModal() {
            document.getElementById('projectModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('projectModal').classList.add('hidden');
        }

        function loadProjects() {
            let savedProjects = JSON.parse(localStorage.getItem('wardProjects')) || [];
            let allProjects = [...savedProjects, ...defaultProjects];
            
            let selectedWard = document.getElementById('filterWardSelect').value;
            let selectedProject = document.getElementById('filterProjectSelect').value;

            let filtered = allProjects.filter(item => {
                let matchWard = (selectedWard === 'সব' || item.ward === selectedWard);
                let matchProject = (selectedProject === 'সব' || item.category === selectedProject);
                return matchWard && matchProject;
            });

            let tbody = document.getElementById('projectTableBody');
            tbody.innerHTML = '';
            
            document.getElementById('totalCount').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">এই ওয়ার্ড বা প্রকল্পের কোনো তথ্য পাওয়া যায়নি।</td></tr>`;
                return;
            }

            filtered.forEach((item) => {
                let pdfButton = item.pdfUrl && item.pdfUrl !== "#" ? 
                    `<a href="${item.pdfUrl}" target="_blank" class="inline-flex items-center gap-2 px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition shadow-sm"><i class="fa-solid fa-file-pdf"></i> পিডিএফ ফাইল দেখুন</a>` : 
                    `<span class="text-slate-400 text-xs italic">পিডিএফ সংযুক্তি প্রক্রিয়াধীন</span>`;

                let statusBadge = item.status ? `<span class="inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold bg-emerald-100 text-emerald-800 rounded-full">${item.status}</span>` : '';

                let row = `
                    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                        <td class="p-3 align-top">
                            <span class="inline-block bg-sky-100 text-sky-800 text-xs px-2.5 py-1 rounded-md font-bold">${item.ward}</span>
                        </td>
                        <td class="p-3 align-top">
                            <span class="font-bold text-sky-700 text-sm block">${item.category} ${statusBadge}</span>
                            <span class="text-xs text-slate-600 block mt-1 leading-relaxed">${item.desc}</span>
                        </td>
                        <td class="p-3 align-top font-bold text-slate-800 text-xs">${item.amount || 'নির্ধারিত নয়'}</td>
                        <td class="p-3 align-top">
                            ${pdfButton}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function applyFilters() {
            loadProjects();
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            alert('আপনার আবেদনটি সফলভাবে সাবমিট হয়েছে!');
            closeModal();
        }

        window.onload = function() {
            loadProjects();
        };
    </script>
