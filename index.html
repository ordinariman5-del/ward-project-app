<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১১ আসনের উন্নয়ন ও প্রকল্প তথ্যভান্ডার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-sky-600 p-2.5 rounded-lg text-white text-xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide">১১ আসনের উন্নয়ন ও প্রকল্প তথ্যভান্ডার</h1>
                    <p class="text-xs sm:text-sm text-slate-300">ওয়ার্ড ও নির্দিষ্ট ১০টি প্রকল্প ভিত্তিক তথ্য এবং আবেদন পোর্টাল</p>
                </div>
            </div>
            <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2.5 rounded-lg font-medium transition shadow flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> সাহায্য বা প্রকল্পের আবেদন করুন
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Filter Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- ওয়ার্ড ফিল্টার -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ওয়ার্ড নির্বাচন করুন:</label>
                    <select id="filterWardSelect" onchange="applyFilters()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
                        <option value="সব">সকল ওয়ার্ড (২৭-৪১)</option>
                        <option value="২৭ নং দক্ষিণ আগ্রাবাদ">২৭ নং দক্ষিণ আগ্রাবাদ</option>
                        <option value="২৮ নং দক্ষিণ পাঠানটুলী">২৮ নং দক্ষিণ পাঠানটুলী</option>
                        <option value="২৯ নং পশ্চিম মাদারবাড়ী">২৯ নং পশ্চিম মাদারবাড়ী</option>
                        <option value="৩০ নং পূর্ব মাদারবাড়ী">৩০ নং পূর্ব মাদারবাড়ী</option>
                        <option value="৩৬ নং গোসাইলডাঙ্গা">৩৬ নং গোসাইলডাঙ্গা</option>
                        <option value="৩৭ নং মুনির নগর">৩৭ নং মুনির নগর</option>
                        <option value="৩৮ নং দক্ষিণ মধ্য হালিশহর">৩৮ নং দক্ষিণ মধ্য হালিশহর</option>
                        <option value="৩৯ নং দক্ষিণ হালিশহর">৩৯ নং দক্ষিণ হালিশহর</option>
                        <option value="৪০ নং উত্তর পতেঙ্গা">৪০ নং উত্তর পতেঙ্গা</option>
                        <option value="৪১ নং দক্ষিণ পতেঙ্গা">৪১ নং দক্ষিণ পতেঙ্গা</option>
                    </select>
                </div>

                <!-- সুনির্দিষ্ট ১০টি প্রকল্পের লিস্ট ফিল্টার -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">প্রকল্প বা অনুদান নির্বাচন করুন:</label>
                    <select id="filterProjectSelect" onchange="applyFilters()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
                        <option value="সব">সকল প্রকল্প ও অনুদান (১০টি নির্দিষ্ট)</option>
                        <option value="১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)">১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)</option>
                        <option value="২। টি.আর কর্মসূচি (৩০ লক্ষ)">২। টি.আর কর্মসূচি (৩০ লক্ষ)</option>
                        <option value="৩। টি.আর কর্মসূচি (৯০ লক্ষ)">৩। টি.আর কর্মসূচি (৯০ লক্ষ)</option>
                        <option value="৪। টি.আর কর্মসূচি (৪০ লক্ষ)">৪। টি.আর কর্মসূচি (৪০ লক্ষ)</option>
                        <option value="৫। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)">৫। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)</option>
                        <option value="৬। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)">৬। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)</option>
                        <option value="৭। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)">৭। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)</option>
                        <option value="৮। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)">৮। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)</option>
                        <option value="৯। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ">৯। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ</option>
                        <option value="১০। ঈদুল আযহা-২০২৬ মাংস বিতরণ">১০। ঈদুল আযহা-২০২৬ মাংস বিতরণ</option>
                    </select>
                </div>

                <!-- সরাসরি সার্চ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">সরাসরি সার্চ করুন:</label>
                    <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="আবেদনকারী বা বিবরণ লিখে খুঁজুন..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
                </div>
            </div>

            <div class="flex justify-between items-center text-sm text-slate-700 font-medium pt-2 border-t border-slate-100">
                <span>প্রদর্শিত প্রজেক্ট ও আবেদন ফলাফল:</span>
                <span id="totalCount" class="font-bold text-sky-600">0</span> টি
            </div>
        </div>

        <!-- Table Structure -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs sm:text-sm border-b border-slate-200">
                            <th class="p-3 font-semibold">ওয়ার্ড</th>
                            <th class="p-3 font-semibold">প্রকল্পের নাম ও বিবরণ</th>
                            <th class="p-3 font-semibold">আবেদনকারী / তথ্য</th>
                            <th class="p-3 font-semibold">বরাদ্দ / পরিমাণ</th>
                            <th class="p-3 font-semibold">সংযুক্ত ছবি ও অবস্থা</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody" class="divide-y divide-slate-200 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="projectModal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-file-pen text-sky-600"></i> নতুন সাহায্য বা প্রকল্পের আবেদন ফরম</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="submissionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ওয়ার্ড নির্বাচন করুন *</label>
                        <select id="wardNo" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none">
                            <option value="">-- ওয়ার্ড সিলেক্ট করুন --</option>
                            <option value="২৭ নং দক্ষিণ আগ্রাবাদ">২৭ নং দক্ষিণ আগ্রাবাদ</option>
                            <option value="২৮ নং দক্ষিণ পাঠানটুলী">২৮ নং দক্ষিণ পাঠানটুলী</option>
                            <option value="২৯ নং পশ্চিম মাদারবাড়ী">২৯ নং পশ্চিম মাদারবাড়ী</option>
                            <option value="৩০ নং পূর্ব মাদারবাড়ী">৩০ নং পূর্ব মাদারবাড়ী</option>
                            <option value="৩৬ নং গোসাইলডাঙ্গা">৩৬ নং গোসাইলডাঙ্গা</option>
                            <option value="৩৭ নং মুনির নগর">৩৭ নং মুনির নগর</option>
                            <option value="৩৮ নং দক্ষিণ মধ্য হালিশহর">৩৮ নং দক্ষিণ মধ্য হালিশহর</option>
                            <option value="৩৯ নং দক্ষিণ হালিশহর">৩৯ নং দক্ষিণ হালিশহর</option>
                            <option value="৪০ নং উত্তর পতেঙ্গা">৪০ নং উত্তর পতেঙ্গা</option>
                            <option value="৪১ নং দক্ষিণ পতেঙ্গা">৪১ নং দক্ষিণ পতেঙ্গা</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">প্রকল্পের খাত নির্বাচন করুন *</label>
                        <select id="projectCategory" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none">
                            <option value="">-- প্রকল্প সিলেক্ট করুন --</option>
                            <option value="১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)">১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)</option>
                            <option value="২। টি.আর কর্মসূচি (৩০ লক্ষ)">২। টি.আর কর্মসূচি (৩০ লক্ষ)</option>
                            <option value="৩। টি.আর কর্মসূচি (৯০ লক্ষ)">৩। টি.আর কর্মসূচি (৯০ লক্ষ)</option>
                            <option value="৪। টি.আর কর্মসূচি (৪০ লক্ষ)">৪। টি.আর কর্মসূচি (৪০ লক্ষ)</option>
                            <option value="৫। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)">৫। প্রাকৃতিক দুর্যোগে সহায়তা (৬০ টন চাল ও ৭ লক্ষ)</option>
                            <option value="৬। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)">৬। সিটি কর্পোরেশন বরাদ্দ (৫ টন চাল)</option>
                            <option value="৭। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)">৭। নিজস্ব তহবিল হতে বন্যা সহায়তা (১০ লক্ষ)</option>
                            <option value="৮। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)">৮। ইসলামিক ফাউন্ডেশন মক্তব তালিকা (২৬টি)</option>
                            <option value="৯। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ">৯। ঈদুল ফিতর-২০২৬ উপহার সামগ্রী বিতরণ</option>
                            <option value="১০। ঈদুল আযহা-২০২৬ মাংস বিতরণ">১০। ঈদুল আযহা-২০২৬ মাংস বিতরণ</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">আবেদনকারীর নাম *</label>
                        <input type="text" id="applicantName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="পূর্ণ নাম লিখুন">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">মোবাইল নম্বর *</label>
                        <input type="tel" id="applicantPhone" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="০১৭xxxxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">জাতীয় পরিচয়পত্র (NID) নম্বর *</label>
                        <input type="text" id="applicantNID" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="NID নম্বর লিখুন">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">বরাদ্দ / প্রয়োজনীয় পরিমাণ</label>
                        <input type="text" id="projectAmount" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="যেমন: ৫০,০০০ টাকা">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">পূর্ণাঙ্গ ঠিকানা *</label>
                    <textarea id="applicantAddress" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="গ্রাম/মহল্লা, রোড নং, এলাকা"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">বিস্তারিত বিবরণ *</label>
                    <textarea id="projectDesc" rows="3" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-600 focus:outline-none" placeholder="বিস্তারিত বিবরণ লিখুন..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">ছবি সংযুক্ত করুন (সর্বোচ্চ ৫টি)</label>
                    <input type="file" id="projectImages" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300 transition">বাতিল</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 text-white rounded-lg text-sm font-medium hover:bg-sky-700 transition">আবেদন সাবমিট করুন</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Data Logic -->
    <script>
        const defaultProjects = [
            {
                ward: "২৭ নং দক্ষিণ আগ্রাবাদ",
                category: "১। ধর্ম মন্ত্রণালয় অনুদান (২৭ লক্ষ)",
                name: "মসজিদ ও মন্দির কমিটি",
                phone: "অফিসিয়াল",
                nid: "সংরক্ষিত",

        function openModal() {
            document.getElementById('projectModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('projectModal').classList.add('hidden');
        }

        function loadProjects() {
            let savedProjects = JSON.parse(localStorage.getItem('wardProjects')) || [];
            let allProjects = [...savedProjects, ...defaultProjects];
            
            let selectedWard = document.getElementById('filterWardSelect').value;
            let selectedProject = document.getElementById('filterProjectSelect').value;
            let searchText = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allProjects.filter(item => {
                let matchWard = (selectedWard === 'সব' || item.ward === selectedWard);
                let matchProject = (selectedProject === 'সব' || item.category === selectedProject);
                let matchSearch = (
                    item.name.toLowerCase().includes(searchText) || 
                    item.desc.toLowerCase().includes(searchText) || 
                    item.nid.toLowerCase().includes(searchText) ||
                    item.ward.toLowerCase().includes(searchText)
                );
                return matchWard && matchProject && matchSearch;
            });

            let tbody = document.getElementById('projectTableBody');
            tbody.innerHTML = '';
            
            document.getElementById('totalCount').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">এই ফিল্টারের আওতায় কোনো তথ্য পাওয়া যায়নি।</td></tr>`;
                return;
            }

            filtered.forEach((item) => {
                let imagesHtml = '';
                if (item.images && item.images.length > 0) {
                    imagesHtml = `<div class="flex gap-1 flex-wrap mt-1">`;
                    item.images.forEach(img => {
                        imagesHtml += `<a href="${img}" target="_blank"><img src="${img}" class="w-8 h-8 object-cover rounded border hover:scale-105 transition"></a>`;
                    });
                    imagesHtml += `</div>`;
                } else {
                    imagesHtml = `<span class="text-slate-400 text-xs">ছবি নেই</span>`;
                }

                let statusBadge = item.status ? `<span class="inline-block mt-1 px-2 py-0.5 text-[10px] font-semibold bg-emerald-100 text-emerald-800 rounded-full">${item.status}</span>` : '';

                let row = `
                    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                        <td class="p-3 align-top">
                            <span class="inline-block bg-sky-100 text-sky-800 text-xs px-2 py-1 rounded-md font-semibold">${item.ward}</span>
                        </td>
                        <td class="p-3 align-top">
                            <span class="font-bold text-sky-700 text-xs block">${item.category}</span>
                            <span class="text-xs text-slate-600 block mt-0.5">${item.desc}</span>
                        </td>
                        <td class="p-3 align-top">
                            <span class="font-bold text-slate-900 block">${item.name}</span>
                            <span class="text-xs text-slate-500 block"><i class="fa-solid fa-phone text-[10px]"></i> ${item.phone}</span>
                            <span class="text-xs text-slate-500 block">NID: ${item.nid}</span>
                            <span class="text-xs text-slate-400">${item.address}</span>
                        </td>
                        <td class="p-3 align-top font-semibold text-slate-800 text-xs">${item.amount || 'নির্ধারিত নয়'}</td>
                        <td class="p-3 align-top text-xs text-slate-500">
                            ${item.date}
                            ${statusBadge}
                            ${imagesHtml}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function applyFilters() {
            loadProjects();
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            let imageInput = document.getElementById('projectImages');
            let images = [];
            let filesCount = Math.min(imageInput.files.length, 5);

            function processFiles(index) {
                if (index < filesCount) {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        images.push(e.target.result);
                        processFiles(index + 1);
                    }
                    reader.readAsDataURL(imageInput.files[index]);
                } else {
                    saveData(images);
                }
            }

            if (filesCount > 0) {
                processFiles(0);
            } else {
                saveData([]);
            }
        }

        function saveData(images) {
            let newEntry = {
                ward: document.getElementById('wardNo').value,
                category: document.getElementById('projectCategory').value,
                name: document.getElementById('applicantName').value,
                phone: document.getElementById('applicantPhone').value,
                nid: document.getElementById('applicantNID').value,
                address: document.getElementById('applicantAddress').value,
                desc: document.getElementById('projectDesc').value,
                amount: document.getElementById('projectAmount').value,
                images: images,
                date: new Date().toLocaleDateString('bn-BD'),
                status: "নতুন আবেদন"
            };

            let projects = JSON.parse(localStorage.getItem('wardProjects')) || [];
            projects.unshift(newEntry);
            localStorage.setItem('wardProjects', JSON.stringify(projects));

            document.getElementById('submissionForm').reset();
            closeModal();
            loadProjects();
            alert('আপনার আবেদনটি সফলভাবে সাবমিট হয়েছে এবং টেবিলে যুক্ত হয়েছে!');
        }

        window.onload = function() {
            loadProjects();
        };
    </script>
