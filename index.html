<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১১ আসনের উন্নয়ন ও প্রকল্প তথ্যভান্ডার</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans Bengali (স্পষ্ট ও সহজ বাংলা ফন্ট) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans Bengali', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 p-2.5 rounded-lg text-white text-xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide">১১ আসনের উন্নয়ন ও প্রকল্প তথ্যভান্ডার</h1>
                    <p class="text-xs sm:text-sm text-slate-300">২৭ থেকে ৪১ নং ওয়ার্ডের প্রকল্প, অনুদান ও বিবরণ ব্যবস্থাপনা</p>
                </div>
            </div>
            <!-- নতুন আবেদন বা প্রজেক্ট যুক্ত করার বাটন -->
            <button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-lg font-medium transition shadow flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> সাহায্য বা প্রকল্পের আবেদন করুন
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Search & Filter Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="w-full md:w-1/3">
                <label class="block text-xs font-semibold text-slate-600 mb-1">সরাসরি সার্চ করুন:</label>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="ওয়ার্ড, আবেদনকারী বা বিবরণ লিখে খুঁজুন..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-600 text-sm">
            </div>
            <div class="text-sm text-slate-700 font-medium">
                মোট প্রজেক্ট ও আবেদন তথ্য: <span id="totalCount" class="font-bold text-brand-600">0</span> টি
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs sm:text-sm border-b border-slate-200">
                            <th class="p-3 font-semibold">ওয়ার্ড নং</th>
                            <th class="p-3 font-semibold">আবেদনকারী / বিষয় ও বিস্তারিত বিবরণ</th>
                            <th class="p-3 font-semibold">এনআইডি ও ঠিকানা</th>
                            <th class="p-3 font-semibold">বরাদ্দ / পরিমাণ</th>
                            <th class="p-3 font-semibold">সংযুক্ত ছবি</th>
                            <th class="p-3 font-semibold">তারিখ ও অবস্থা</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- তথ্য ডাইনামিকভাবে আসবে -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal for New Submission Form -->
    <div id="projectModal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-file-pen text-brand-600"></i> নতুন সাহায্য বা প্রকল্পের আবেদন ফরম</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <form id="submissionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">আবেদনকারীর নাম / প্রজেক্ট টাইটেল *</label>
                        <input type="text" id="applicantName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="নাম বা বিষয় লিখুন">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">মোবাইল নম্বর *</label>
                        <input type="tel" id="applicantPhone" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="০১৭xxxxxxxx">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">জাতীয় পরিচয়পত্র (NID) নম্বর *</label>
                        <input type="text" id="applicantNID" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="NID নম্বর লিখুন">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ওয়ার্ড নির্বাচন করুন *</label>
                        <input type="text" id="wardNo" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="যেমন: ২৭ নং দক্ষিণ আগ্রাবাদ">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">পূর্ণাঙ্গ ঠিকানা *</label>
                    <textarea id="applicantAddress" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="গ্রাম/মহল্লা, রোড নং, এলাকা"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">প্রকল্প বা সাহায্যের বিস্তারিত বিবরণ *</label>
                    <textarea id="projectDesc" rows="3" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="বিবরণ লিখুন..."></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">বরাদ্দ / প্রয়োজনীয় পরিমাণ</label>
                        <input type="text" id="projectAmount" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-brand-600 focus:outline-none" placeholder="যেমন: ২৭ লক্ষ টাকা">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">ছবি সংযুক্ত করুন (সর্বোচ্চ ৫টি)</label>
                        <input type="file" id="projectImages" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-300 transition">বাতিল</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition">আবেদন সাবমিট করুন</button>
                </div>
            </form>
        </div>
